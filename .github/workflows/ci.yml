name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: make check

  # Rebuild-and-hash check for the generated corpus (Saagar's decision for
  # generated corpus files): re-bake src/corpus.generated.ts from the
  # portfolio-index commit pinned in corpus.source.json with the committed
  # generator, and fail unless the result is byte-identical. Generated-corpus
  # PRs merge on this check instead of a two-key review of the 1.6 MB file.
  corpus-rebuild:
    # Dependabot PRs get no Actions secrets, and its npm/actions bumps cannot
    # change the corpus (the generator uses only Node built-ins, and Node is
    # pinned by .node-version), so the job is skipped for them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # A re-bake PR lands on this check alone, so it may change only the
      # generated corpus and its pin; generator changes go through two-key.
      - name: Re-bake PRs change only the corpus and its pin
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if printf '%s\n' "$changed" | grep -qx 'src/corpus.generated.ts'; then
            other=$(printf '%s\n' "$changed" | grep -vxE 'src/corpus\.generated\.ts|corpus\.source\.json' || true)
            if [ -n "$other" ]; then
              echo "::error::A PR that changes src/corpus.generated.ts may change only it and corpus.source.json. Also changed:"
              printf '%s\n' "$other"
              exit 1
            fi
          fi
      # portfolio-index is private: a read-only (contents: read) token for it.
      - run: node scripts/corpus-source.mjs --check
        env:
          PORTFOLIO_INDEX_TOKEN: ${{ secrets.PORTFOLIO_INDEX_READ_TOKEN }}
